<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Salón de Belleza</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Gestión de Clientes</h1>

  <!-- Formulario -->
  <form id="clienteForm">
    <input type="text" id="nombre" placeholder="Nombre" required>
    <input type="text" id="servicio" placeholder="Servicio" required>
    <input type="number" id="telefono" placeholder="Teléfono" required>
    <button type="submit">Guardar</button>
  </form>

  <!-- Tabla de registros -->
  <table>
    <thead>
      <tr>
        <th>Nombre</th>
        <th>Servicio</th>
        <th>Teléfono</th>
        <th>Acciones</th>
      </tr>
    </thead>
    <tbody id="listaClientes"></tbody>
  </table>

  <script src="app.js"></script>
</body>
</html>
